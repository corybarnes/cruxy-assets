<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Venue Wireframe Builder — Cruxy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Arial,sans-serif;background:#f0f0f0}
#app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
#sidebar{width:220px;min-width:220px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden}
#sidebar-header{padding:12px 14px 8px;border-bottom:1px solid #eee}
#sidebar-header h3{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#888}
#palette{flex:1;overflow-y:auto;padding:8px}
.cat-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#bbb;padding:10px 6px 4px}
.block-chip{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:4px;cursor:pointer;font-size:12px;color:#555;border:1px solid transparent;margin-bottom:2px}
.block-chip:hover{background:#f5f5f5;border-color:#e0e0e0}
.block-chip svg{width:14px;height:14px;flex-shrink:0;color:#aaa}

/* Canvas area */
#canvas-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
#canvas-toolbar{padding:10px 14px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px;background:#fff}
#canvas-toolbar select{font-size:11px;padding:5px 8px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#555;cursor:pointer}
#block-count{font-size:11px;color:#aaa;flex:1;margin-left:4px}
.tbtn{font-size:11px;padding:5px 12px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#555;cursor:pointer}
.tbtn:hover{background:#f5f5f5}
.tbtn.danger:hover{background:#fff0f0;color:#c0392b;border-color:#e0b0b0}
#canvas{flex:1;overflow-y:auto;padding:14px;background:#e8e8e8}
#empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#bbb;gap:8px;text-align:center}
#empty svg{width:36px;height:36px;opacity:.4}
#empty p{font-size:13px}
#empty small{font-size:11px;opacity:.7}

/* Canvas blocks */
.cb{background:#fff;border:1px solid #ddd;border-radius:4px;margin-bottom:6px;overflow:hidden}
.cb-header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f8f8f8;border-bottom:1px solid #eee}
.cb-name{font-size:11px;font-weight:700;color:#555;flex:1}
.cb-cat{font-size:10px;color:#bbb;background:#eee;padding:1px 6px;border-radius:3px}
.cb-actions{display:flex;gap:3px}
.cb-actions button{background:none;border:none;cursor:pointer;color:#ccc;font-size:13px;padding:2px 5px;border-radius:3px;line-height:1}
.cb-actions button:hover{color:#555;background:#eee}
.cb-actions .del:hover{color:#c0392b}
.cb-preview{padding:10px 12px}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header"><h3>Venue Blocks</h3></div>
    <div id="palette"></div>
  </div>
  <div id="canvas-area">
    <div id="canvas-toolbar">
      <select id="tpl-select">
        <option value="">Load template…</option>
        <option value="homepage_ecommerce">Homepage (Ecommerce)</option>
        <option value="homepage_brand">Homepage (Brand Story)</option>
        <option value="about">About Page</option>
        <option value="contact">Contact Page</option>
        <option value="landing">Landing Page (Product Launch)</option>
        <option value="collection">Collection / Category Support</option>
        <option value="faq">FAQ / Support Page</option>
        <option value="events">Events Page</option>
      </select>
      <span id="block-count">0 blocks</span>
      <button class="tbtn" onclick="exportList()">↗ Export to Claude</button>
      <button class="tbtn danger" onclick="clearCanvas()">✕ Clear</button>
    </div>
    <div id="canvas">
      <div id="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
        <p>Click blocks to add them</p>
        <small>or load a template above</small>
      </div>
    </div>
  </div>
</div>
<script>
const blocks = [
  {id:'slideshow',name:'Slideshow',cat:'Hero',preview:'hero_full'},
  {id:'hero_video',name:'Hero Video',cat:'Hero',preview:'hero_video'},
  {id:'img_text_banner',name:'Image + Text Banner',cat:'Hero',preview:'img_text_banner'},
  {id:'announcement',name:'Announcement Bar',cat:'Utility',preview:'announcement'},
  {id:'featured_collection',name:'Featured Collection',cat:'Products',preview:'grid'},
  {id:'featured_product',name:'Featured Product',cat:'Products',preview:'featured_product'},
  {id:'product_recs',name:'Product Recommendations',cat:'Products',preview:'grid_sm'},
  {id:'img_left_text',name:'Image + Left Text',cat:'Content',preview:'img_left_text'},
  {id:'img_right_text',name:'Image + Right Text',cat:'Content',preview:'img_right_text'},
  {id:'img_left_overlap',name:'Image + Left Overlap Text',cat:'Content',preview:'img_left_overlap'},
  {id:'img_right_overlap',name:'Image + Right Overlap Text',cat:'Content',preview:'img_right_overlap'},
  {id:'before_after',name:'Before / After',cat:'Content',preview:'before_after'},
  {id:'rich_text',name:'Rich Text',cat:'Content',preview:'rich_text'},
  {id:'multicolumn_icons',name:'Multicolumn Icons',cat:'Content',preview:'multicolumn'},
  {id:'multicolumn_images',name:'Multicolumn Images',cat:'Content',preview:'multicolumn_img'},
  {id:'logo_list',name:'Logo List',cat:'Social Proof',preview:'logo_list'},
  {id:'testimonial',name:'Testimonial',cat:'Social Proof',preview:'testimonial'},
  {id:'testimonials_multi',name:'Testimonials Multiple',cat:'Social Proof',preview:'testimonials_multi'},
  {id:'blog_posts',name:'Blog Posts',cat:'Content',preview:'blog_posts'},
  {id:'newsletter',name:'Newsletter',cat:'Conversion',preview:'newsletter'},
  {id:'countdown',name:'Countdown Timer',cat:'Conversion',preview:'countdown'},
  {id:'popup',name:'Popup',cat:'Conversion',preview:'popup'},
  {id:'faqs',name:'FAQs',cat:'Support',preview:'faqs'},
  {id:'contact_form',name:'Contact Form',cat:'Support',preview:'contact_form'},
  {id:'map',name:'Map',cat:'Support',preview:'map'},
  {id:'events',name:'Events',cat:'Support',preview:'events'},
  {id:'custom_html',name:'Custom HTML',cat:'Advanced',preview:'custom_html'},
  {id:'custom_liquid',name:'Custom Liquid',cat:'Advanced',preview:'custom_liquid'},
  {id:'spacer',name:'Spacer',cat:'Utility',preview:'spacer'},
];

const templates = {
  homepage_ecommerce:['slideshow','announcement','featured_collection','img_left_text','multicolumn_icons','testimonials_multi','newsletter'],
  homepage_brand:['slideshow','img_text_banner','featured_collection','img_left_overlap','multicolumn_icons','before_after','testimonial','newsletter'],
  about:['img_text_banner','rich_text','img_right_text','multicolumn_icons','logo_list','testimonials_multi'],
  contact:['rich_text','contact_form','map'],
  landing:['hero_video','featured_product','multicolumn_icons','before_after','testimonials_multi','countdown','newsletter'],
  collection:['img_text_banner','rich_text','multicolumn_icons'],
  faq:['rich_text','faqs','contact_form'],
  events:['img_text_banner','events','rich_text','contact_form','map'],
};

const bar = (w,h=7)=>`<div style="height:${h}px;border-radius:3px;background:#d4ccc6;width:${w}"></div>`;
const rect = (w,h,extra='')=>`<div style="width:${w};height:${h}px;border-radius:4px;background:#f2ede8;border:1px solid #d4ccc6;${extra}"></div>`;
const row = (content,gap=8)=>`<div style="display:flex;gap:${gap}px;align-items:center">${content}</div>`;
const btn = (label='')=>`<div style="height:28px;line-height:28px;padding:0 16px;border-radius:3px;border:1.5px solid #1a1a1a;font-size:10px;font-family:Arial;color:#1a1a1a;display:inline-block">${label||''}</div>`;

const previews = {
  hero_full:`${rect('100%',56)}`,
  hero_video:`<div style="height:48px;background:#f2ede8;border-radius:4px;border:1px solid #d4ccc6;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`,
  img_text_banner:row(`${rect('38%',40)}` + `<div style="flex:1;display:flex;flex-direction:column;gap:5px">${bar('70%')}${bar('50%',5)}</div>`),
  announcement:`<div style="height:16px;background:#1a1a1a;border-radius:3px;display:flex;align-items:center;justify-content:center">${bar('35%',5).replace('#d4ccc6','rgba(255,255,255,.3)')}</div>`,
  grid:row([0,1,2,3].map(()=>`<div style="flex:1;display:flex;flex-direction:column;gap:5px">${rect('100%',36)}${bar('60%',5)}${bar('30%',5)}</div>`).join('')),
  grid_sm:row([0,1,2].map(()=>`<div style="flex:1;display:flex;flex-direction:column;gap:5px">${rect('100%',28)}${bar('55%',5)}</div>`).join('')),
  featured_product:row(`${rect('44%',52)}` + `<div style="flex:1;display:flex;flex-direction:column;gap:6px;padding-left:4px">${bar('55%')}${bar('25%',5)}${bar('80%',5)}<div style="margin-top:4px">${btn('Shop Now')}</div></div>`),
  img_left_text:row(`<div style="flex:1;display:flex;flex-direction:column;gap:5px">${bar('65%')}${bar('90%',5)}${bar('70%',5)}<div style="margin-top:4px">${btn('Learn More')}</div></div>` + `${rect('46%',52,'margin-left:8px')}`),
  img_right_text:row(`${rect('46%',52)}` + `<div style="flex:1;display:flex;flex-direction:column;gap:5px;padding-left:8px">${bar('65%')}${bar('90%',5)}${bar('70%',5)}<div style="margin-top:4px">${btn('Learn More')}</div></div>`),
  img_left_overlap:`<div style="position:relative;height:48px"><div style="position:absolute;left:0;top:0;width:55%;height:44px;background:#f2ede8;border-radius:4px;border:1px solid #d4ccc6"></div><div style="position:absolute;right:0;top:8px;width:52%;display:flex;flex-direction:column;gap:4px;background:#fff;padding:6px;border-radius:3px">${bar('75%')}${bar('55%',5)}</div></div>`,
  img_right_overlap:`<div style="position:relative;height:48px"><div style="position:absolute;right:0;top:0;width:55%;height:44px;background:#f2ede8;border-radius:4px;border:1px solid #d4ccc6"></div><div style="position:absolute;left:0;top:8px;width:52%;display:flex;flex-direction:column;gap:4px;background:#fff;padding:6px;border-radius:3px">${bar('75%')}${bar('55%',5)}</div></div>`,
  before_after:row(`<div style="flex:1;height:36px;background:#f2ede8;border-radius:4px 0 0 4px;border:1px solid #d4ccc6;display:flex;align-items:center;justify-content:center"><span style="font-size:9px;color:#aaa">before</span></div><div style="flex:1;height:36px;background:#e8e3de;border-radius:0 4px 4px 0;border:1px solid #d4ccc6;border-left:none;display:flex;align-items:center;justify-content:center"><span style="font-size:9px;color:#aaa">after</span></div>`,0),
  rich_text:`<div style="display:flex;flex-direction:column;align-items:center;gap:5px">${bar('40%')}${bar('80%',5)}${bar('65%',5)}</div>`,
  multicolumn:row([0,1,2,3].map(()=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:24px;height:24px;background:#f2ede8;border-radius:50%;border:1px solid #d4ccc6"></div>${bar('70%',5)}${bar('55%',5)}</div>`).join('')),
  multicolumn_img:row([0,1,2].map(()=>`<div style="flex:1;display:flex;flex-direction:column;gap:5px">${rect('100%',28)}${bar('65%',5)}${bar('50%',5)}</div>`).join('')),
  logo_list:`<div style="display:flex;justify-content:center;gap:16px">${[0,1,2,3].map(()=>rect('44px',20)).join('')}</div>`,
  testimonial:`<div style="display:flex;flex-direction:column;align-items:center;gap:6px">${bar('55%',5)}${bar('40%',5)}</div>`,
  testimonials_multi:row([0,1,2].map(()=>`<div style="flex:1;background:#fdf8f4;border-radius:4px;padding:8px;border:1px solid #d4ccc6;display:flex;flex-direction:column;gap:5px">${bar('75%',5)}${bar('55%',5)}</div>`).join('')),
  blog_posts:row([0,1,2].map(()=>`<div style="flex:1;display:flex;flex-direction:column;gap:5px">${rect('100%',24)}${bar('70%',5)}${bar('50%',5)}</div>`).join('')),
  newsletter:`<div style="background:#1a1a1a;border-radius:4px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px">${bar('40%',6).replace('#d4ccc6','rgba(255,255,255,.3)')}<div style="display:flex">${rect('100px',22,'border-radius:3px 0 0 3px;border-right:none')}<div style="width:50px;height:22px;background:#c9a882;border-radius:0 3px 3px 0"></div></div></div>`,
  countdown:`<div style="display:flex;justify-content:center;gap:8px">${['dd','hh','mm','ss'].map(l=>`<div style="width:32px;height:32px;background:#f2ede8;border-radius:4px;border:1px solid #d4ccc6;display:flex;align-items:center;justify-content:center;font-size:8px;color:#aaa">${l}</div>`).join('')}</div>`,
  popup:`<div style="display:flex;align-items:center;justify-content:center;height:40px">${rect('55%',34,'display:flex;align-items:center;justify-content:center').replace('</div>','<span style="font-size:9px;color:#aaa">popup</span></div>')}</div>`,
  faqs:`<div style="display:flex;flex-direction:column;gap:4px">${[0,1,2].map(()=>`<div style="display:flex;align-items:center;justify-content:space-between;background:#f8f8f8;padding:5px 8px;border-radius:3px;border:1px solid #eee">${bar('50%',5)}<span style="font-size:10px;color:#ccc">∨</span></div>`).join('')}</div>`,
  contact_form:`<div style="display:flex;flex-direction:column;gap:5px">${rect('100%',16)}${rect('100%',16)}${rect('100%',28)}<div style="margin-top:2px">${btn('Submit')}</div></div>`,
  map:`<div style="height:44px;background:#e8e3de;border-radius:4px;border:1px solid #d4ccc6;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.5"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg></div>`,
  events:`<div style="display:flex;flex-direction:column;gap:5px">${[0,1].map(()=>`<div style="display:flex;align-items:center;gap:8px">${rect('32px',28)}${bar('45%',5)}</div>`).join('')}</div>`,
  custom_html:`<div style="height:28px;background:#f2ede8;border-radius:4px;border:1px solid #d4ccc6;display:flex;align-items:center;justify-content:center"><code style="font-size:10px;color:#aaa">&lt;/&gt;</code></div>`,
  custom_liquid:`<div style="height:28px;background:#f2ede8;border-radius:4px;border:1px solid #d4ccc6;display:flex;align-items:center;justify-content:center"><code style="font-size:10px;color:#aaa">{%  %}</code></div>`,
  spacer:`<div style="height:14px;border:1px dashed #d4ccc6;border-radius:3px;display:flex;align-items:center;justify-content:center"><span style="font-size:9px;color:#ccc">spacer</span></div>`,
};

let placed=[], counter=0;

function buildPalette(){
  const cats=[...new Set(blocks.map(b=>b.cat))];
  const pal=document.getElementById('palette');
  pal.innerHTML='';
  cats.forEach(cat=>{
    const l=document.createElement('div');
    l.className='cat-label';l.textContent=cat;pal.appendChild(l);
    blocks.filter(b=>b.cat===cat).forEach(b=>{
      const c=document.createElement('div');
      c.className='block-chip';
      c.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="17" width="18" height="4" rx="1"/></svg><span>${b.name}</span>`;
      c.onclick=()=>addBlock(b);
      pal.appendChild(c);
    });
  });
}

function addBlock(b){placed.push({...b,uid:++counter});render();}
function removeBlock(uid){placed=placed.filter(b=>b.uid!==uid);render();}
function moveBlock(uid,dir){
  const i=placed.findIndex(b=>b.uid===uid);
  if(dir===-1&&i===0||dir===1&&i===placed.length-1)return;
  const a=[...placed];[a[i],a[i+dir]]=[a[i+dir],a[i]];placed=a;render();
}
function clearCanvas(){placed=[];render();}
function loadTemplate(key){
  if(!key)return;
  placed=[];counter=0;
  (templates[key]||[]).forEach(id=>{const b=blocks.find(x=>x.id===id);if(b)placed.push({...b,uid:++counter});});
  render();document.getElementById('tpl-select').value='';
}
function exportList(){
  if(!placed.length){alert('Canvas is empty.');return;}
  const list=placed.map((b,i)=>`${i+1}. ${b.name} (${b.id})`).join('\n');
  const msg=`Here is my current wireframe block order:\n\n${list}\n\nCan you generate the wireframe HTML for this layout?`;
  const ta=document.createElement('textarea');
  ta.value=msg;document.body.appendChild(ta);ta.select();
  document.execCommand('copy');document.body.removeChild(ta);
  alert('Copied to clipboard! Paste into Claude.');
}

function render(){
  const c=document.getElementById('canvas');
  document.getElementById('block-count').textContent=placed.length+' block'+(placed.length===1?'':'s');
  if(!placed.length){
    c.innerHTML=`<div id="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg><p>Click blocks to add them</p><small>or load a template above</small></div>`;
    return;
  }
  c.innerHTML='';
  placed.forEach((b,i)=>{
    const el=document.createElement('div');el.className='cb';
    el.innerHTML=`<div class="cb-header"><span class="cb-name">${b.name}</span><span class="cb-cat">${b.cat}</span><div class="cb-actions"><button onclick="moveBlock(${b.uid},-1)" title="Up">↑</button><button onclick="moveBlock(${b.uid},1)" title="Down">↓</button><button class="del" onclick="removeBlock(${b.uid})" title="Remove">✕</button></div></div><div class="cb-preview">${previews[b.preview]||''}</div>`;
    c.appendChild(el);
  });
}

document.getElementById('tpl-select').onchange=function(){loadTemplate(this.value);};
buildPalette();render();
</script>
</body>
</html>
